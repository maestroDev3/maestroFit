name: maestrofit
description: "Persönliche Trainings-App für Krafttraining: Übungen nachschlagen, Muskeln visualisieren, Training tracken."
publish_to: 'none'

# versionName+versionCode für Android; Schema wird in Story #39 festgezurrt.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Zustand (Riverpod 3 mit Codegenerierung)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Navigation (Shell in Task #42)
  go_router: ^14.0.0
  # Lokale Datenbank (Aufbau in späteren Stories)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  # Unveränderliche Modelle
  freezed_annotation: ^3.0.0
  # Einstellungen (Theme, Sprache, Einheiten)
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Codegenerierung: läuft in der CI vor Analyse und Tests
  # (generierte Dateien werden nicht eingecheckt, siehe .gitignore)
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
