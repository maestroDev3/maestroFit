# Strikte Analyse gemäß .claude/skills/flutter-dart/SKILL.md Abschnitt 3.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
