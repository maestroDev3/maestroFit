# Provisorische Brücke, bis Story #39 (echte Signierung) und #40 (automatische
# Releases) umgesetzt sind: baut auf Abruf eine Test-APK (Debug-Signatur) und
# veröffentlicht sie als Pre-Release zum Abnehmen der jeweiligen Story.
name: Test-APK veröffentlichen

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag des Pre-Release (z. B. v0.1.0-story13)"
        required: true

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.8" # muss zu .fvmrc passen
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Bauen
        run: |
          set -eux
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter test
          flutter build apk --release

      - name: Pre-Release mit APK anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cp build/app/outputs/flutter-apk/app-release.apk "maestrofit-${{ inputs.tag }}.apk"
          gh release create "${{ inputs.tag }}" \
            --prerelease \
            --title "Testversion ${{ inputs.tag }}" \
            --notes "Testversion mit Debug-Signatur zur Story-Abnahme. Echte Signierung und automatische Releases kommen mit Story #39/#40." \
            "maestrofit-${{ inputs.tag }}.apk"
