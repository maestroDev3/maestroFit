# CI je PR und auf main (Story #15): Analyse, Codegen, Tests.
# Reproduzierbar: Flutter exakt gepinnt (siehe .fvmrc), Actions per SHA,
# Lockfile erzwungen. Updates über den Wartungs-Workflow (maintenance.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.8" # muss zu .fvmrc passen
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Abhängigkeiten (Lockfile erzwungen)
        run: flutter pub get --enforce-lockfile

      - name: Codegenerierung
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Debug-APK bauen
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Debug-APK als Artefakt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
