# Einmaliger Bootstrap: erzeugt das Flutter-Projektgerüst auf einem Runner
# (lokale Flutter-Installation ist in der Agent-Umgebung nicht möglich)
# und pusht es als Branch task/41-projektgeruest. Nach Merge von #41 löschbar.
name: Bootstrap Flutter-Projekt

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-Projekt erzeugen und prüfen
        run: |
          set -eux
          flutter --version
          flutter create --org de.maestrodev --project-name maestrofit --platforms android .
          flutter pub get
          flutter analyze
          flutter test

      - name: Branch task/41-projektgeruest pushen
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b task/41-projektgeruest
          git add -A
          git commit -m "Flutter-Projektgerüst per Bootstrap-Workflow erzeugen (#41)"
          git push -u origin task/41-projektgeruest --force
